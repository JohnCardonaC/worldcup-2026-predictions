<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026 · Predicciones</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d3748; --line:#21262d;
  --txt:#e6edf3; --muted:#8b949e; --acc:#3fb950; --acc2:#58a6ff;
  --warn:#d29922; --bad:#f85149; --pred:#1f2a3d; --real:#1f3326; --blue:#1f6feb;
  --grad1:#23d36b; --grad2:#58a6ff;
  --tcard1:#16243a; --tcard2:#161b22; --tcardb:#2d4368;
  --champ1:#3a2d00; --champ2:#1c2330;
  --headglow:radial-gradient(ellipse 60% 130% at 18% 0%,rgba(31,111,235,.18),transparent 60%),radial-gradient(ellipse 40% 120% at 85% 100%,rgba(35,211,107,.10),transparent 60%);
}
body.light{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f0f3f8; --border:#d6dce5; --line:#e9edf2;
  --txt:#1b2533; --muted:#5d6878; --acc:#178a3e; --acc2:#0969da;
  --warn:#996a00; --bad:#cf222e; --pred:#e9f0fd; --real:#e5f4ea; --blue:#1f6feb;
  --grad1:#0a9e4e; --grad2:#0969da;
  --tcard1:#eaf1fc; --tcard2:#ffffff; --tcardb:#bcd2f0;
  --champ1:#fff3cd; --champ2:#ffffff;
  --headglow:radial-gradient(ellipse 60% 130% at 18% 0%,rgba(9,105,218,.08),transparent 60%),radial-gradient(ellipse 40% 120% at 85% 100%,rgba(10,158,78,.07),transparent 60%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;transition:background .25s,color .25s}
/* ===== HEADER ===== */
header{position:sticky;top:0;z-index:50;background:var(--panel);background-image:var(--headglow);border-bottom:1px solid var(--border);padding:22px 24px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.cup{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;
  background:linear-gradient(145deg,rgba(255,200,40,.22),rgba(255,200,40,.05));border:1px solid rgba(214,160,30,.45);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.ttl h1{font-size:25px;font-weight:900;letter-spacing:2.5px;line-height:1.1;text-transform:uppercase}
.ttl h1 .y{background:linear-gradient(90deg,var(--grad1),var(--grad2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl .sub{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl .sub .prg{display:inline-flex;align-items:center;gap:5px}
.ttl .sub .prgbar{width:64px;height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.ttl .sub .prgbar i{display:block;height:100%;background:linear-gradient(90deg,var(--grad1),var(--grad2))}
.hostflags{font-size:13px;letter-spacing:2px}
.spacer{flex:1}
.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;transition:border-color .15s,transform .1s,background .15s}
button:hover{border-color:var(--acc2);transform:translateY(-1px)}
button.icon{padding:7px 9px;font-size:14px;line-height:1}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.12)}
button:disabled{opacity:.5;cursor:wait;transform:none}
#lastUpd{font-size:10.5px;color:var(--muted);width:100%;text-align:right;margin-top:-4px}
#lastUpd:empty{display:none}
.stripe{height:4px;background:linear-gradient(90deg,#ce1126 0%,#ce1126 18%,#f5f5f5 22%,#006847 38%,#006847 60%,#f5f5f5 64%,#0a3161 80%,#0a3161 100%);opacity:.9}
nav{display:flex;gap:8px;background:var(--panel);padding:10px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
nav button{border:1px solid transparent;background:transparent;padding:11px 22px;border-radius:11px;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.3px}
nav button:hover{border-color:var(--border);transform:none}
nav button.on{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(31,111,235,.35)}
main{padding:16px;max-width:1500px;margin:0 auto}
.hint{color:var(--muted);font-size:12px;margin-bottom:12px;line-height:1.5}
/* GRUPOS */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px}
.gcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.gcard h2{font-size:14px;padding:8px 12px;background:var(--panel2);display:flex;justify-content:space-between;align-items:center}
.gcard h2 .gname{color:var(--acc2)}
table.stand{width:100%;border-collapse:collapse;font-size:12px}
table.stand th{color:var(--muted);font-weight:500;text-align:center;padding:3px 4px}
table.stand td{padding:3px 4px;text-align:center;border-top:1px solid var(--line)}
table.stand td.tname{text-align:left;white-space:nowrap}
table.stand tr.q1 td{background:rgba(63,185,80,.10)}
table.stand tr.q3 td{background:rgba(210,153,34,.08)}
.mrow{display:grid;grid-template-columns:46px 1fr 84px 14px 84px 30px;gap:6px;align-items:center;padding:5px 10px;border-top:1px solid var(--line);font-size:13px}
.mrow .date{color:var(--muted);font-size:11px}
.mrow .teams{display:flex;flex-direction:column;gap:2px;line-height:1.2}
.pair{display:flex;gap:4px;justify-content:center}
.pair input{width:36px;text-align:center;background:var(--pred);border:1px solid var(--border);color:var(--txt);border-radius:5px;padding:3px 2px;font-size:13px}
.pair.real input{background:var(--real)}
.pair input:focus{outline:1px solid var(--acc2)}
.vsep{color:var(--muted);text-align:center}
.hitmark{text-align:center;font-size:14px}
.hit-exact{color:var(--acc)} .hit-out{color:var(--warn)} .hit-no{color:var(--bad)}
.collabels{display:grid;grid-template-columns:46px 1fr 84px 14px 84px 30px;gap:6px;padding:2px 10px;font-size:10px;color:var(--muted);text-transform:uppercase}
.collabels span:nth-child(3),.collabels span:nth-child(5){text-align:center}
/* BRACKET */
.kmodebar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.kmodebar .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.kmodebar .seg button{border:none;border-radius:0}
.kmodebar .seg button.on{background:var(--blue);color:#fff}
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:12px;align-items:stretch}
.bround{min-width:215px;display:flex;flex-direction:column}
.bround h3{font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;text-align:center}
.bround .stack{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.kmatch{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:13px}
.kmatch .mn{font-size:10px;color:var(--muted);padding:2px 8px;background:var(--panel2);display:flex;justify-content:space-between}
.kteam{display:flex;align-items:center;gap:6px;padding:5px 8px;cursor:pointer;border-top:1px solid var(--line)}
.kteam:hover{background:var(--panel2)}
.kteam.sel{background:rgba(63,185,80,.15);font-weight:700}
.kteam.dim{opacity:.45}
.kteam .ksc{margin-left:auto;font-weight:700;font-size:13px;min-width:18px;text-align:right}
.kteam.placeholder{color:var(--muted);cursor:default;font-size:12px}
.kteam .okko{margin-left:auto;font-size:12px}
.champbox{margin-top:10px;background:linear-gradient(135deg,var(--champ1),var(--champ2));border:1px solid var(--warn);border-radius:10px;padding:14px;text-align:center}
.champbox .lbl{font-size:11px;color:var(--warn);text-transform:uppercase;letter-spacing:1px}
.champbox .cname{font-size:18px;font-weight:800;margin-top:4px}
/* STATS */
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.scard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
.scard h3{font-size:13px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.bignum{font-size:30px;font-weight:800;color:var(--acc)}
.bignum small{font-size:13px;color:var(--muted);font-weight:400}
.srow{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.srow:last-child{border:none}
.bar{height:6px;background:var(--panel2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
/* HOY */
.todaywrap{margin-bottom:20px;text-align:center}
.todaywrap h2{font-size:15px;margin-bottom:2px}
.todaywrap .tz{font-size:11px;color:var(--muted);margin-bottom:10px}
.todaycards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.tcard{background:linear-gradient(160deg,var(--tcard1),var(--tcard2));border:1px solid var(--tcardb);border-radius:12px;padding:14px;width:310px;max-width:100%;text-align:left}
.tcard .when{display:flex;align-items:baseline;gap:8px}
.tcard .hour{font-size:26px;font-weight:800;color:var(--acc2)}
.tcard .venue{font-size:11px;color:var(--muted)}
.tcard .duel{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.tcard .duel .side{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;text-align:center}
.tcard .duel .flag{font-size:34px;line-height:1}
.tcard .duel .nm{font-size:13px;font-weight:600}
.tcard .duel .mid{font-size:16px;color:var(--muted);font-weight:700;white-space:nowrap}
.tcard .duel .mid b{color:var(--txt);font-size:20px}
.tcard .foot{margin-top:8px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.tcard.ko{border-color:#5a4a16}
/* CLOUD */
#cloudModal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200}
#cloudModal .box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:380px;width:92%}
#cloudModal h3{margin-bottom:6px}
#cloudModal p{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
#cloudModal input{width:100%;margin-bottom:8px;background:var(--panel2);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:9px 10px;font-size:14px}
#cloudModal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
#cloudStatus{font-size:10px;margin-left:4px}
.rank-table{width:100%;border-collapse:collapse;font-size:13px}
.rank-table th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px}
.rank-table td{padding:4px 6px;border-top:1px solid var(--line)}
.rank-table tr.me td{background:rgba(63,185,80,.12);font-weight:700}
.pair input:disabled{opacity:.55;cursor:not-allowed;background:var(--panel2)}
.pair.real input:disabled{opacity:1;cursor:default;background:var(--real);border-color:transparent}
.lockico{font-size:10px;color:var(--muted)}
/* MODAL LOG */
#updlog{position:fixed;bottom:16px;right:16px;max-width:420px;max-height:50vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;display:none;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#updlog h4{margin-bottom:6px;font-size:13px}
#updlog .lg{padding:2px 0;color:var(--muted)}
#updlog .lg.ok{color:var(--acc)}
#updlog .lg.err{color:var(--bad)}
#updlog .x{position:absolute;top:6px;right:10px;cursor:pointer;color:var(--muted)}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
@media(max-width:560px){.groups{grid-template-columns:1fr}.mrow{grid-template-columns:38px 1fr 74px 10px 74px 22px}}
</style>
</head>

/* ============ LÓGICA PURA (tablas y bracket) ============ */
function isScore(v){return Array.isArray(v)&&Number.isInteger(v[0])&&Number.isInteger(v[1])&&v[0]>=0&&v[1]>=0;}
// Tabla de un grupo a partir de un mapa de resultados {matchId:[h,a]}
function tableFor(g,res){
  const rows=GROUPS[g].map((t,i)=>({t,pos:i,pj:0,pts:0,gf:0,gc:0,gd:0}));
  const by=Object.fromEntries(rows.map(r=>[r.t,r]));
  for(const m of GM){ if(m.g!==g)continue; const r=res[m.id]; if(!isScore(r))continue;
    const H=by[m.h],A=by[m.a]; H.pj++;A.pj++; H.gf+=r[0];H.gc+=r[1]; A.gf+=r[1];A.gc+=r[0];
    if(r[0]>r[1])H.pts+=3; else if(r[0]<r[1])A.pts+=3; else {H.pts++;A.pts++;}
  }
  rows.forEach(r=>r.gd=r.gf-r.gc);
  // Criterios FIFA 2026: pts, dif. de gol, goles a favor. (4-6: conducta/ranking FIFA — no computables:
  // se usa la posición del sorteo como desempate estable.)
  rows.sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf||x.pos-y.pos);
  return rows;
}
function groupComplete(g,res){return GM.filter(m=>m.g===g).every(m=>isScore(res[m.id]));}
function allGroupsComplete(res){return [...GL].every(g=>groupComplete(g,res));}
// Devuelve {W:{A:'MEX',...}, R:{...}, T3:{A:{t,..stats}}, thirdsKey, slotAssign:{A:'3X grupo'}}
function classify(res){
  const W={},R={},T3=[];
  for(const g of GL){const tb=tableFor(g,res);W[g]=tb[0].t;R[g]=tb[1].t;T3.push(Object.assign({g},tb[2]));}
  T3.sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf||x.g.localeCompare(y.g));
  const qual=T3.slice(0,8).map(x=>x.g).sort().join('');
  const assign={};const map=COMBOS[qual];
  if(map)T_SLOT_ORDER.forEach((slot,i)=>{assign[slot]=map[i];});
  const T={};for(const s in assign){const g=assign[s];T[s]=tableFor(g,res)[2].t;}
  return {W,R,T,thirdsKey:qual,thirdsRank:T3};
}
// Equipos de cada llave del R32 dado un classify()
function r32Teams(cl,mid){
  return R32[mid].map(([k,g])=>{
    if(k==='W')return cl.W[g]; if(k==='R')return cl.R[g];
    return cl.T[g]||null; // tercero asignado al slot del 1° de grupo g
  });
}
// winners: mapa matchId->teamId ganador. Devuelve [home,away] (teamId|null) de cualquier partido KO
function koTeams(mid,cl,winners){
  if(R32[mid])return r32Teams(cl,mid);
  if(R16[mid])return R16[mid].map(m=>winners[m]||null);
  if(QF[mid])return QF[mid].map(m=>winners[m]||null);
  if(SF[mid])return SF[mid].map(m=>winners[m]||null);
  if(mid===103)return [101,102].map(m=>{const t=koTeams(m,cl,winners);if(!t[0]||!t[1]||!winners[m])return null;return winners[m]===t[0]?t[1]:t[0];});
  if(mid===104)return [101,102].map(m=>winners[m]||null);
  return [null,null];
}
const ALL_KO_IDS=[...Object.keys(R32),...Object.keys(R16),...Object.keys(QF),...Object.keys(SF),103,104].map(Number);
// Conjunto de equipos predichos/reales que ALCANZAN cada ronda
function teamsReachingRounds(cl,winners){
  const reach={r32:new Set(),r16:new Set(),qf:new Set(),sf:new Set(),fin:new Set(),champ:new Set()};
  if(!cl)return reach;
  for(const mid of Object.keys(R32).map(Number)){const[h,a]=r32Teams(cl,mid);if(h)reach.r32.add(h);if(a)reach.r32.add(a);}
  for(const[mid,srcs]of Object.entries(R16))srcs.forEach(s=>{if(winners[s])reach.r16.add(winners[s]);});
  for(const[mid,srcs]of Object.entries(QF))srcs.forEach(s=>{if(winners[s])reach.qf.add(winners[s]);});
  for(const[mid,srcs]of Object.entries(SF))srcs.forEach(s=>{if(winners[s])reach.sf.add(winners[s]);});
  [101,102].forEach(s=>{if(winners[s])reach.fin.add(winners[s]);});
  if(winners[104])reach.champ.add(winners[104]);
  return reach;
}
/* ============ GANADORES KO (pred y real) ============ */
// Predicción: marcador en state.predKOsc[mid]={h,a}; si define ganador, manda.
// Si hay empate (penales) o no hay marcador, vale el clic en state.predKO[mid]=teamId.
function predWinnerOf(mid,h,a){
  const sc=state.predKOsc[mid];
  if(sc&&isScore([sc.h,sc.a])&&sc.h!==sc.a)return sc.h>sc.a?h:a;
  const sel=state.predKO[mid];
  if(sel&&(sel===h||sel===a))return sel;
  return null;
}
function predWinners(cl){
  const w={};
  if(!cl)return w;
  for(const mid of ALL_KO_IDS){if(mid===103)continue;
    const[h,a]=koTeams(mid,cl,w);
    if(!h||!a)continue;
    const win=predWinnerOf(mid,h,a);
    if(win)w[mid]=win;
  }
  return w;
}
// Real: state.realKO[mid]={h,a,win} (win obligatorio si empate). Ganador derivado del marcador.
function realWinners(cl){
  const w={};
  if(!cl)return w;

/* ============ CIERRE DE PREDICCIONES (anti-trampa) ============ */
function hasStarted(ts){return ts&&Date.now()>=new Date(ts).getTime();}
function gmStarted(m){return hasStarted(m.ts);}
function koStarted(mid){const k=KICKOFF[String(mid)];return k?hasStarted(k.ts):false;}
// Predicciones efectivas: partido iniciado sin predicción cuenta como 0-0
function predEffective(){
  const out=Object.assign({},state.pred);
  for(const m of GM)if(!isScore(out[m.id])&&gmStarted(m))out[m.id]=[0,0];
  return out;
}
/* ============ ESTADÍSTICAS DE ACIERTO ============ */
function groupStats(){
  let played=0,outcome=0,exact=0;
  const pe=predEffective();
  for(const m of GM){const p=pe[m.id],r=state.real[m.id];
    if(!isScore(p)||!isScore(r))continue; played++;
    if(p[0]===r[0]&&p[1]===r[1]){exact++;outcome++;}
    else if(Math.sign(p[0]-p[1])===Math.sign(r[0]-r[1]))outcome++;
  }
  return {played,outcome,exact};
}
function bracketStats(){
  const pe=predEffective();
  const pc=allGroupsComplete(pe)?classify(pe):null;
  const rc=allGroupsComplete(state.real)?classify(state.real):null;
  const pw=predWinners(pc),rw=realWinners(rc);
  const P=teamsReachingRounds(pc,pw),R=teamsReachingRounds(rc,rw);
  const rounds=[['r32',32],['r16',16],['qf',8],['sf',4],['fin',2],['champ',1]];
  return rounds.map(([k,tot])=>{
    const real=R[k],pred=P[k];let hit=0;
    for(const tm of real)if(pred.has(tm))hit++;
    return {k,tot,confirmed:real.size,hit,predCount:pred.size};
  });
}
const PTS={exact:3,outcome:1,r32:1,r16:2,qf:3,sf:5,fin:8,champ:13};
// Marcadores en eliminatorias: comparables solo cuando tu llave tiene los mismos 2 equipos que la real
function koScoreStats(){
  const pe=predEffective();
  const pc=allGroupsComplete(pe)?classify(pe):null;
  const rc=allGroupsComplete(state.real)?classify(state.real):null;
  if(!pc||!rc)return {comparable:0,outcome:0,exact:0};
  const pw=predWinners(pc),rw=realWinners(rc);
  let comparable=0,outcome=0,exact=0;
  for(const mid of ALL_KO_IDS){
    const psc=state.predKOsc[mid],r=state.realKO[mid];
    if(!psc||!isScore([psc.h,psc.a])||!r||!isScore([r.h,r.a]))continue;
    const[ph,pa]=koTeams(mid,pc,pw),[rh,ra]=koTeams(mid,rc,rw);
    if(!ph||!pa||!rh||!ra)continue;
    let mine=null;
    if(ph===rh&&pa===ra)mine=[psc.h,psc.a];
    else if(ph===ra&&pa===rh)mine=[psc.a,psc.h];
    if(!mine)continue;
    comparable++;
    if(mine[0]===r.h&&mine[1]===r.a){exact++;outcome++;}
    else if(Math.sign(mine[0]-mine[1])===Math.sign(r.h-r.a))outcome++;
  }
  return {comparable,outcome,exact};
}
function totalPoints(){
  const g=groupStats();const b=bracketStats();const k=koScoreStats();
  let pts=g.exact*PTS.exact+(g.outcome-g.exact)*PTS.outcome;
  pts+=k.exact*PTS.exact+(k.outcome-k.exact)*PTS.outcome;
  for(const r of b)pts+=r.hit*PTS[r.k];
  return pts;
}

    if(results){
      changes=applyResults(results);
      if(!auto)logLine(changes?t('applied',changes):t('noNew'));
      if(auto&&changes){const b=logBox();b.innerHTML=`<span class="x" onclick="this.parentElement.style.display='none'">✕</span><h4>${t('autoUpdated',changes)}</h4>`;setTimeout(()=>{b.style.display='none';},8000);}
      state.lastUpd=new Date().toISOString();save();renderAll();
    }else if(!auto){
      logLine(t('noSource'),'err');
    }
  }finally{updRunning=false;}
}
// Actualización automática: al abrir (si pasaron >3 h) y periódicamente mientras la página esté abierta
const UPD_MS=3*3600*1000;
function maybeAutoUpdate(){
  const last=state.lastUpd?new Date(state.lastUpd).getTime():0;
  if(Date.now()-last>UPD_MS)actualizarResultados(true);
}
// --- fixturedownload.com (calendario FIFA completo con resultados) ---
async function fromFixtureDownload(){
  const j=await (await fetch('https://fixturedownload.com/feed/json/fifa-world-cup-2026',{signal:AbortSignal.timeout(12000)})).json();
  if(!Array.isArray(j)||!j.length)throw new Error('respuesta vacía');
  const out=[];
  for(const m of j){
    if(m.HomeTeamScore==null||m.AwayTeamScore==null)continue;
    const h=teamFromName(m.HomeTeam),a=teamFromName(m.AwayTeam);
    if(!h||!a)continue;
    const rec={h,a,hs:+m.HomeTeamScore,as:+m.AwayTeamScore,hp:null,ap:null};
    if(rec.hs===rec.as&&m.Winner){const w=teamFromName(m.Winner);if(w===h){rec.hp=1;rec.ap=0;}else if(w===a){rec.hp=0;rec.ap=1;}}
    out.push(rec);
  }
  if(!out.length)throw new Error('sin partidos finalizados aún');
  return out;
}
// --- FIFA oficial ---
async function fromFIFA(){
  const ctl=AbortSignal.timeout(12000);
  const sj=await (await fetch('https://api.fifa.com/api/v3/seasons?idCompetition=17&count=40&language=en',{signal:ctl})).json();
  const seasons=(sj.Results||[]).filter(s=>String(s.StartDate||'').startsWith('2026'));
  if(!seasons.length)throw new Error('temporada 2026 no encontrada');
  const sid=seasons[0].IdSeason;
  const mj=await (await fetch(`https://api.fifa.com/api/v3/calendar/matches?idCompetition=17&idSeason=${sid}&count=300&language=en`,{signal:AbortSignal.timeout(15000)})).json();
  const out=[];
  for(const m of (mj.Results||[])){
    if(m.MatchStatus!==0)continue; // 0 = finalizado
    const h=teamFromName(m.Home?.Abbreviation)||teamFromName(m.Home?.TeamName?.[0]?.Description);
    const a=teamFromName(m.Away?.Abbreviation)||teamFromName(m.Away?.TeamName?.[0]?.Description);
    if(!h||!a)continue;
    out.push({h,a,hs:m.Home.Score,as:m.Away.Score,hp:m.Home.PenaltyScore,ap:m.Away.PenaltyScore});
  }
  if(!out.length)throw new Error('sin partidos finalizados');
  return out;
}
// --- TheSportsDB (gratuita; puede ir con retraso) ---
function* datesToCheck(){
  const today=new Date();
  const start=new Date('2026-06-11T00:00:00Z');
  const end=new Date(Math.min(today.getTime()+86400000*2,new Date('2026-07-21').getTime()));
  for(let d=new Date(start);d<=end;d.setUTCDate(d.getUTCDate()+1))yield d.toISOString().slice(0,10);
}
async function fromTSDB(){
  const out=[];let any=false;
  for(const day of datesToCheck()){
    let j;
    try{j=await (await fetch(`https://www.thesportsdb.com/api/v1/json/123/eventsday.php?d=${day}&l=4429`,{signal:AbortSignal.timeout(9000)})).json();}
    catch(e){continue;}
    any=true;
    for(const ev of (j.events||[])){
      if(ev.intHomeScore==null||ev.intAwayScore==null)continue;
      const st=(ev.strStatus||'').toUpperCase();
      if(st==='NS'||st.includes('POSTP'))continue;
      const h=teamFromName(ev.strHomeTeam),a=teamFromName(ev.strAwayTeam);
      if(!h||!a)continue;
      out.push({h,a,hs:+ev.intHomeScore,as:+ev.intAwayScore,hp:null,ap:null});
    }
    await new Promise(r=>setTimeout(r,180));
  }
  if(!any)throw new Error('sin conexión con la API');
  return out;
}
// Aplica resultados: primero a los 72 de grupos (match exacto de par de equipos),
// luego a las llaves reales del bracket que estén definidas.
function applyResults(list){
  let n=0;
  const used=new Set();
  for(const r of list){
    const gm=GM.find(m=>(m.h===r.h&&m.a===r.a));
    const gmInv=gm?null:GM.find(m=>(m.h===r.a&&m.a===r.h));
    const m=gm||gmInv;
    if(m&&!used.has(m.id)){
      const sc=gm?[r.hs,r.as]:[r.as,r.hs];
      const prev=state.real[m.id];
      if(!isScore(prev)||prev[0]!==sc[0]||prev[1]!==sc[1]){state.real[m.id]=sc;n++;logLine(`Grupo ${m.g}: ${TEAMS[m.h].n} ${sc[0]}–${sc[1]} ${TEAMS[m.a].n}`,'ok');}
      used.add(m.id);r._done=true;
    }
  }
  // knockout: requiere bracket real definido
  if(allGroupsComplete(state.real)){
    const cl=classify(state.real);
    for(let pass=0;pass<6;pass++){ // varias pasadas: las rondas dependen de las anteriores
      const w=realWinners(cl);
      for(const r of list){
        if(r._done)continue;
        for(const mid of ALL_KO_IDS){
          const[h,a]=koTeams(mid,cl,w);
          if(!h||!a)continue;
          const dir=(h===r.h&&a===r.a),inv=(h===r.a&&a===r.h);
          if(!dir&&!inv)continue;
          const sc=dir?[r.hs,r.as]:[r.as,r.hs];
          const cur=state.realKO[mid]||{};
          let win=null;
          if(sc[0]===sc[1]&&r.hp!=null&&r.ap!=null)win=(dir?(r.hp>r.ap):(r.ap>r.hp))?h:a;
          if(cur.h!==sc[0]||cur.a!==sc[1]||(win&&cur.win!==win)){
            state.realKO[mid]={h:sc[0],a:sc[1],win:win||cur.win||null};n++;
            logLine(`P${mid}: ${TEAMS[h].n} ${sc[0]}–${sc[1]} ${TEAMS[a].n}${win?' (pen: '+TEAMS[win].n+')':''}`,'ok');
          }
          r._done=true;break;
        }
        if(r._done)continue;
      }
    }
  }
  return n;
}
/* ============ NUBE (backend opcional Lambda+DynamoDB) ============ */
const CLOUD_URL="https://ue3b6ehqrf.execute-api.us-east-1.amazonaws.com/"; // vacío = la función de nube se oculta y la app es 100% local
const cloudOn=()=>CLOUD_URL.startsWith('http');
let cloudStatus='ok', cloudTimer=null, RANK=null;
async function hashId(email){
  const s='wc2026:'+email.trim().toLowerCase();
  try{
    const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,40);
  }catch(e){ // fallback sin secure context
    let h1=0x811c9dc5,h2=0x01000193;
    for(let i=0;i<s.length;i++){h1=Math.imul(h1^s.charCodeAt(i),0x01000193)>>>0;h2=Math.imul(h2^s.charCodeAt(i),0x85ebca6b)>>>0;}
    return ('00000000'+h1.toString(16)).slice(-8)+('00000000'+h2.toString(16)).slice(-8);
  }
}
function cloudPayload(){
  return {id:state.cloudId,name:state.cloudName,email:state.cloudEmail||undefined,pub:state.cloudPublic!==false,
    state:{pred:state.pred,predKO:state.predKO,predKOsc:state.predKOsc,real:state.real,realKO:state.realKO},
    points:totalPoints(),pred_count:GM.filter(m=>isScore(state.pred[m.id])).length};
}
async function cloudPush(){
  if(!cloudOn()||!state.cloudId)return;
  setCloudStatus('saving');
  try{
    const r=await fetch(CLOUD_URL+'player',{method:'PUT',headers:{'content-type':'application/json'},
      body:JSON.stringify(cloudPayload()),signal:AbortSignal.timeout(10000)});
    setCloudStatus(r.ok?'ok':'err');
  }catch(e){setCloudStatus('err');}
}
function scheduleCloudPush(){
  if(!cloudOn()||!state.cloudId)return;
  clearTimeout(cloudTimer);setCloudStatus('saving');
  cloudTimer=setTimeout(cloudPush,2500);
}
function setCloudStatus(s){cloudStatus=s;updateCloudBtn();}
function updateCloudBtn(){
  const b=$('btnCloud');if(!b)return;
  if(!cloudOn()){b.style.display='none';return;}
  b.style.display='';
  b.innerHTML=state.cloudId?`☁️ ${state.cloudName} <span id="cloudStatus">${t(cloudStatus==='saving'?'cloudSaving':cloudStatus==='err'?'cloudErr':'cloudOk')}</span>`:t('cloudBtn');
}
// Flujo: paso 'email' (siempre) → si el correo ya existe, entra directo con su nombre;
// si es nuevo, paso 'name'. Obligatorio al abrir la app (clMandatory) salvo fallo de red.
let clStep='email',clPendingId=null,clMandatory=false;
function cloudOpen(mandatory){
  clMandatory=!!mandatory;clStep='email';clPendingId=null;
  const m=$('cloudModal');m.style.display='flex';
  const conn=!!state.cloudId;
  $('clErr').style.display='none';$('clOffline').style.display='none';
  $('clEmail').placeholder=t('cloudEmailPh');$('clName').placeholder=t('cloudNamePh');
  $('clOffline').textContent=t('cloudOffline');$('clCancel').textContent=t('cloudCancel');
  $('clPubTxt').textContent=t('cloudPubLabel');
  if(conn){
    $('clTitle').textContent=t('cloudAsTitle');
    $('clDesc').innerHTML=t('cloudAsDesc',state.cloudName);
    $('clEmail').style.display='none';$('clName').style.display='none';
    $('clPubWrap').style.display='flex';$('clPub').checked=state.cloudPublic!==false;
    $('clCancel').style.display='';
    $('clDisc').style.display='';$('clDisc').textContent=t('cloudSwitch');
    $('clGo').textContent=t('cloudSyncNow');
  }else{
    $('clTitle').textContent=t('cloudTitle');
    $('clDesc').textContent=t('cloudStep1Desc');
    $('clEmail').style.display='';$('clName').style.display='none';
    $('clPubWrap').style.display='none';
    $('clCancel').style.display=clMandatory?'none':'';
    $('clDisc').style.display='none';
    $('clGo').textContent=t('cloudContinue');
    setTimeout(()=>$('clEmail').focus(),50);
  }
}
function cloudClose(force){
  if(clMandatory&&!state.cloudId&&!force)return; // obligatorio: no se cierra sin sesión
  $('cloudModal').style.display='none';
}
async function cloudSubmit(){
  if(state.cloudId){cloudPush();cloudClose();return;} // sesión activa → sync manual
  const go=$('clGo');
  if(clStep==='email'){
    const email=$('clEmail').value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showClErr(t('cloudBadEmail'));return;}
    go.disabled=true;
    const id=await hashId(email);
    let remote=null,netOk=true;
    try{
      const r=await fetch(CLOUD_URL+'player/'+id,{signal:AbortSignal.timeout(10000)});
      if(!r.ok)throw new Error('http '+r.status);
      remote=(await r.json()).item;
    }catch(e){netOk=false;}
    go.disabled=false;
    if(!netOk){showClErr(t('cloudNetErr'));$('clOffline').style.display='';return;}
    if(remote&&remote.name){ // registrado: entra directo con su nombre
      const localCount=GM.filter(m=>isScore(state.pred[m.id])).length;
      if(remote.state&&remote.pred_count>0&&localCount>0){
        if(confirm(t('cloudConflict',remote.pred_count,localCount)))applyRemoteState(remote.state);
      }else if(remote.state&&remote.pred_count>0){
        applyRemoteState(remote.state);
      }
      state.cloudId=id;state.cloudName=remote.name;state.cloudEmail=email.toLowerCase();state.cloudPublic=remote.pub!==false;
      save();clMandatory=false;cloudClose(true);renderAll();cloudPush();RANK=null;
    }else{ // primera vez: pedir nombre
      clPendingId=id;clStep='name';
      $('clTitle').textContent=t('cloudStep2Title');
      $('clDesc').textContent=t('cloudStep2Desc');
      $('clEmail').style.display='none';$('clName').style.display='';
      $('clPubWrap').style.display='flex';$('clPub').checked=true;
      $('clErr').style.display='none';
      const guess=email.split('@')[0].replace(/[._-]+/g,' ').trim();
      if(!$('clName').value)$('clName').value=guess.charAt(0).toUpperCase()+guess.slice(1,29);
      $('clGo').textContent=t('cloudCreate');
      setTimeout(()=>{$('clName').focus();$('clName').select();},50);
    }
  }else{ // paso nombre
    const name=$('clName').value.trim();
    if(!name){showClErr(t('cloudNeedName'));return;}
    const dropped=dropLatePredictions();
    if(dropped)alert(t('droppedLate',dropped));
    state.cloudId=clPendingId;state.cloudName=name.slice(0,30);
    state.cloudEmail=($('clEmail').value.trim()||'').toLowerCase();
    state.cloudPublic=$('clPub').checked;
    save();clMandatory=false;cloudClose(true);renderAll();cloudPush();RANK=null;
  }
}
function showClErr(msg){const e=$('clErr');e.textContent=msg;e.style.display='';}
function applyRemoteState(s){
  state.pred=s.pred||{};state.predKO=s.predKO||{};state.predKOsc=s.predKOsc||{};
  state.real=Object.assign(s.real||{},state.real);state.realKO=Object.assign(s.realKO||{},state.realKO);
}
function cloudPubChanged(){
  if(!state.cloudId)return; // en registro se lee al enviar
  state.cloudPublic=$('clPub').checked;save();cloudPush();RANK=null;renderStats();
}
// Espejo de la regla del servidor: al registrarse como nuevo, las predicciones
// de partidos ya iniciados no son verificables y se descartan (cuentan 0-0).
function dropLatePredictions(){
  let n=0;
  for(const m of GM)if(gmStarted(m)&&isScore(state.pred[m.id])){delete state.pred[m.id];n++;}
  for(const mid of ALL_KO_IDS){
    if(!koStarted(mid))continue;
    if(state.predKO[mid]){delete state.predKO[mid];n++;}
    if(state.predKOsc[mid])delete state.predKOsc[mid];
  }
  return n;
}
function cloudSwitch(){delete state.cloudId;delete state.cloudName;delete state.cloudEmail;delete state.cloudPublic;save();updateCloudBtn();renderStats();cloudOpen(true);}
async function loadRanking(){
  const box=$('rankBox');if(!box)return;
  box.innerHTML=`<span class="hint">${t('rankLoading')}</span>`;
  try{
    const r=await fetch(CLOUD_URL+'ranking',{signal:AbortSignal.timeout(10000)});
    RANK=(await r.json()).players||[];
    renderRanking();
  }catch(e){box.innerHTML=`<span class="hint">${t('cloudErr')}</span>`;}
}
function renderRanking(){
  const box=$('rankBox');if(!box)return;
  const priv=state.cloudId&&state.cloudPublic===false?`<p class="hint" style="margin-bottom:8px">🔒 ${t('rankPrivate')}</p>`:'';
  if(!RANK||!RANK.length){box.innerHTML=priv+`<span class="hint">${t('rankEmpty')}</span>`;return;}
  let h=priv+`<table class="rank-table"><tr><th>#</th><th>${t('rankPlayer')}</th><th>${t('rankPts')}</th><th>${t('rankPreds')}</th></tr>`;
  RANK.forEach((p,i)=>{
    const me=state.cloudName&&p.name===state.cloudName;
    h+=`<tr class="${me?'me':''}"><td>${i+1}</td><td>${String(p.name||'').replace(/[<>&]/g,'')}</td><td><b>${p.points|0}</b></td><td>${p.pred_count|0}/72</td></tr>`;
  });
  box.innerHTML=h+'</table>';
}
/* ============ EXPORT / IMPORT / TABS ============ */
let tab='grupos';
function setTab(tb){tab=tb;['grupos','bracket','stats'].forEach(x=>{$('view-'+x).style.display=x===tb?'':'none';$('tab-'+x).classList.toggle('on',x===tb);});
  if(tb==='stats'&&cloudOn()&&!RANK)loadRanking();}
function playedCount(){
  let n=GM.filter(m=>isScore(state.real[m.id])).length;
  for(const mid of ALL_KO_IDS){const r=state.realKO[mid];if(r&&isScore([r.h,r.a]))n++;}
  return n;
}
function renderChrome(){
  $('appTitle').innerHTML=t('title');
  $('appSub').textContent=t('subTitle');
  const n=playedCount();
  $('prgFill').style.width=Math.round(100*n/104)+'%';
  $('prgTxt').textContent=t('played',n);
  $('btnLang').textContent=LANG==='es'?'🌐 EN':'🌐 ES';
  $('btnTheme').textContent=curTheme()==='light'?'🌙':'☀️';
  $('tab-grupos').textContent=t('tabGroups');
  $('tab-bracket').textContent=t('tabBracket');
  $('tab-stats').textContent=t('tabStats');
  document.documentElement.lang=LANG;
  document.title=LANG==='es'?'Mundial 2026 · Predicciones':'World Cup 2026 · Predictions';
  $('starCta').textContent=t('starCta');
  $('createdBy').textContent=t('createdBy');
  updateCloudBtn();
}
function renderAll(){
  renderChrome();renderGrupos();renderBracket();renderStats();
  $('lastUpd').textContent=state.lastUpd?(t('lastUpd')+new Date(state.lastUpd).toLocaleString(t('locale'))+t('autoNote')):'';
}
/* ============ INIT ============ */
if(typeof window!=='undefined'&&typeof document!=='undefined'&&document.getElementById('view-grupos')){
  load();renderAll();
  if(cloudOn()&&!state.cloudId)cloudOpen(true); // registro obligatorio al entrar (correo; nombre solo la 1ª vez)
  maybeAutoUpdate();
  setInterval(maybeAutoUpdate,15*60*1000); // revisa cada 15 min si ya tocan las 3 h (robusto ante laptops dormidas)
}
